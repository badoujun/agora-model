# Release workflow — 仅在推送 semver tag (v*) 时触发。
#
# 触发后做两件事：
#   1. 对比「上一次 release tag」与「本次 tag」在 cmd/agoramodel/main.go 中
#      `var version = "..."` 的字面值；未变化则视为「非版本号更新」并跳过发版。
#      （tag 本身只是发布动作的触发器，应用版本号必须在 main.go 里手动改，
#       这一道闸是防止「tag 重复推送 / 误打 tag / 只改了文档」时也去发包。）
#   2. 版本号确实变了才执行：构建三平台六份产物 → 打 7 个 npm tarball → 发布。
#
# 凭据：GitHub Actions OIDC（npm trusted publishing），全程不使用任何长期 token。
#   1. npmjs.com 上必须为「每一个包」配置 Trusted Publisher（6 个平台包 + 1 个主包
#      = 7 条），workflow 文件名填 `release.yml`，仓库填 `badoujun/agora-model`。
#      这些字段是精确匹配的，任一处不符只会得到一个晦涩的 404 / ENEEDAUTH。
#   2. 必须有 `permissions: id-token: write`（见 jobs.release.permissions）：
#      runner 靠它换取 OIDC token，缺了就没法向 npm 证明「我是这个 workflow」。
#   3. npm CLI 必须 ≥ 11.5.1，Node 必须 ≥ 22.14：Node 20 自带 npm 10.x，
#      压根不认识 OIDC，会一路退化成「无凭据发布」。故这里用 Node 24 并显式升级 npm。
#   4. 发布步骤上绝不能出现 NODE_AUTH_TOKEN / NPM_TOKEN 一类的凭据变量（哪怕空串）：
#      npm 会先走 token 认证路径，并且不再回落到 OIDC。
#
# 仓库默认值固定为官方 registry（与 npm/scripts/publish.mjs 的 DEFAULT_REGISTRY 一致），
# 不沿用 `npm config get registry`：内网常把它换成只读镜像，发布必然 403；
# 且 OIDC 只对 https://registry.npmjs.org 生效，换源同样会 404。
#
# 失败策略：任何一步失败立即中断，不允许「半发版」（已发布的包 npm 不允许再覆盖）。
# 想本地复跑：`node npm/scripts/publish.mjs --dry-run` 看产物清单。

name: release

on:
  push:
    tags:
      # 严格三段式 semver：v1.2.3；带预发布后缀（v1.2.3-rc.1）也算。
      # 不接受 v1 / v1.2 这种简写——和 build.mjs / publish.mjs 的 normalizeVersion 一致。
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# release 不需要并发：同 tag 不应二次发（npm 会拒绝同一版本号重复发）。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: 发布 ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      # checkout 只需要读代码。
      contents: read
      # OIDC trusted publishing 的必要条件：允许 runner 申请 OIDC token，
      # npm 据此换取「仅本次 workflow 有效」的短期发布凭据。
      id-token: write
    # 环境变量与 Actions 语法见 https://docs.github.com/zh/actions
    env:
      # 与 npm/scripts/publish.mjs 的 DEFAULT_REGISTRY 对齐：固定官方源，
      # 不读 runner 上的 `npm config get registry`，避免内网镜像干扰。
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v5
        with:
          # 关键：必须 fetch tags，否则 git describe 拿不到历史 tag，
          # 上一次 release tag 的比对就退化为「找不到上次 → 误判为版本号变了」。
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          # 不能用 Node 20：它自带 npm 10.x，完全不支持 OIDC，
          # 发布时会退化成「无凭据」并报 ENEEDAUTH。
          node-version: '24'
          # 刻意不设 registry-url：该选项会往 ~/.npmrc 写一行
          # `_authToken=${NODE_AUTH_TOKEN}`，OIDC 发布时会因此不走 OIDC 路径。

      # OIDC 要求 npm CLI ≥ 11.5.1；不显式升级的话，某些 Node 24 小版本自带的
      # npm 仍低于该线，症状同样是晦涩的 ENEEDAUTH。
      # 这里顺带打印版本，日志里能直接确认「会说 OIDC 的那个 npm」确实生效了。
      - name: 升级 npm（trusted publishing 需要 ≥ 11.5.1）
        if: steps.version-check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          npm install -g 'npm@^11.5.1' --no-fund --no-audit
          npm --version

      # ---------------------------------------------------------------- 版本号比对
      #
      # 用 git show 直接取两个 tag 指向的 main.go 里 `var version = "..."` 的字面值。
      # 第一次发版（仓库里没有上一个 release tag）视为「版本号更新」，
      # 避免新仓库永远发不出第一个包。
      #
      # set -e：任何 git / grep 失败立即终止整个 release；这正是我们想要的失败模式。
      - name: 比对版本号是否变化
        id: version-check
        shell: bash
        run: |
          set -euo pipefail

          # 形如 v1.2.3 或 v1.2.3-rc.1 的 release tag；按创建时间倒序取。
          # `git tag` 默认只列本地可见 tag，已能覆盖「同一次 push 触发的 workflow」所需范围。
          mapfile -t TAGS < <(
            git tag --sort=-creatordate --format='%(refname:short)' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$' \
              || true
          )

          if [ "${#TAGS[@]}" -eq 0 ]; then
            echo "未找到任何 release tag，无法进行比对"
            exit 1
          fi

          CURRENT="${TAGS[0]}"
          PREV=""
          if [ "${#TAGS[@]}" -ge 2 ]; then
            PREV="${TAGS[1]}"
          fi

          if [ "$CURRENT" != "${{ github.ref_name }}" ]; then
            # 理论上不会发生（workflow 触发条件已限定 tag 名），但显式校验更稳妥。
            echo "最新本地 tag ($CURRENT) 与本次推送 tag (${{ github.ref_name }}) 不一致"
            exit 1
          fi

          # 提取 `var version = "x.y.z"`：取该行第一个 `"…"` 区间（防行内出现第二个引号对被误抓）。
          extract_version() {
            git show "$1":cmd/agoramodel/main.go \
              | grep -E '^[[:space:]]*var[[:space:]]+version[[:space:]]*=' \
              | head -n1 \
              | sed -nE 's/.*"([^"]+)".*/\1/p' \
              | head -n1
          }

          CUR_VER="$(extract_version "$CURRENT")"
          if [ -z "$CUR_VER" ]; then
            echo "无法从 $CURRENT:cmd/agoramodel/main.go 提取版本号"
            exit 1
          fi

          echo "current_tag=$CURRENT"
          echo "current_version=$CUR_VER"

          if [ -z "$PREV" ]; then
            echo "prev_tag=(none)"
            echo "prev_version=(none)"
            echo "reason=首次发布，无历史 tag"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "OK：首次发布，直接进入发版流程（version=$CUR_VER）"
            exit 0
          fi

          PREV_VER="$(extract_version "$PREV")"
          if [ -z "$PREV_VER" ]; then
            echo "无法从 $PREV:cmd/agoramodel/main.go 提取版本号"
            exit 1
          fi

          echo "prev_tag=$PREV"
          echo "prev_version=$PREV_VER"

          if [ "$CUR_VER" = "$PREV_VER" ]; then
            echo "reason=版本号未变化（$CUR_VER == $PREV_VER）"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "跳过发版：本次推送未更新 cmd/agoramodel/main.go 中的 version"
          else
            echo "reason=版本号已更新（$PREV_VER → $CUR_VER）"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "OK：版本号已更新 ($PREV_VER → $CUR_VER)，进入发版流程"
          fi

      # ---------------------------------------------------------------- 构建产物
      # 仅在版本号真的变了时执行；用 steps.version-check.outputs.changed 控制跳过。
      - name: 构建三平台六份产物
        if: steps.version-check.outputs.changed == 'true'
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          # Makefile 已自带 GOPROXY 镜像兜底；直接调它即可，行为与本地一致。
          make dist

      # ---------------------------------------------------------------- 打 npm 包
      # 复用 npm/scripts/build.mjs：版本号取自 git describe（已被 checkout 拉全 tag），
      # 与 main.go 里的 version 一致（version-check 已经验证）。
      - name: 打包 7 个 npm tarball
        if: steps.version-check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          node npm/scripts/build.mjs

      # ---------------------------------------------------------------- 凭据（OIDC）
      # 这里没有任何凭据注入步骤，这是刻意的：npm CLI 会在 OIDC 环境里自行用
      # ACTIONS_ID_TOKEN_REQUEST_URL 换取「仅本次 workflow 有效」的短期 token，
      # 并自动附带 provenance（不再需要 --provenance）。
      # 一旦在此处设置 NODE_AUTH_TOKEN / NPM_TOKEN（哪怕空串），npm 就会先走
      # token 认证路径，且不再回落到 OIDC——这是迁到 trusted publishing 后最常见的坑。
      #
      # 另外：OIDC 下没有可预检的登录态，`npm whoami` 必然失败（身份交换只发生在
      # publish 那一刻）。因此发布脚本在 OIDC 环境下会跳过 whoami 预检，
      # 凭据是否配对要到真正 publish 时才见分晓——出错请回看 npm 的 404 / ENEEDAUTH
      # 报错，并逐项核对上面的 4 条要求。

      # ---------------------------------------------------------------- 发布
      # publish.mjs 会先发 6 个平台包、再发主包；该顺序由 npm install 时
      # optionalDependencies 的解析方式决定，不能调换。
      # 故意不传 --tag：发到 latest（与初次发版约定一致；想预发请手动传 --tag=next）。
      - name: 发布 7 个 npm 包
        if: steps.version-check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # --registry 显式覆盖：与 publish.mjs 默认值一致，但显式传入更稳妥；
          # OIDC 也认不出别的源（镜像源只会 404）。
          node npm/scripts/publish.mjs --registry="$NPM_CONFIG_REGISTRY"
