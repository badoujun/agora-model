name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # 三平台 × 两架构的构建与冒烟矩阵（T0.6）
  build-test:
    name: ${{ matrix.runner }} / ${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, goos: windows, goarch: amd64 }
          - { runner: windows-latest, goos: windows, goarch: arm64 }
          - { runner: ubuntu-latest,  goos: linux,   goarch: amd64 }
          - { runner: ubuntu-latest,  goos: linux,   goarch: arm64 }
          - { runner: macos-latest,   goos: darwin,  goarch: amd64 }
          - { runner: macos-latest,   goos: darwin,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # 由 go.mod 决定（当前 1.25+，受 modernc.org/sqlite 最低版本要求约束）
          go-version-file: go.mod
          cache: true

      # 冒烟脚本是 Node（tools/smoke/*.mjs），三平台共用同一份，
      # 因此 runner 上必须有 Node（托管 runner 自带，这里显式固定版本）。
      # 用 v5 而非 v4：v4 的 action 自身运行在 Node 20 runtime，已被 GitHub 弃用并强制升到 24。
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # 前端必须先构建：Go 用 embed 把 internal/webui/dist 打进二进制，
      # 若此时目录里只有占位文件（internal/webui/dist/robots.txt），产物就不含 Web UI，
      # phase4 的断言会直接失败——「单文件交付」要验证的正是这份内嵌结果。
      - name: 构建前端（供 embed 内嵌）
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix web ci
          npm --prefix web run build

      - name: gofmt（与 make fmt 同一判据）
        shell: bash
        run: |
          set -euo pipefail
          out="$(gofmt -l cmd internal)"
          if [ -n "$out" ]; then
            echo "以下文件未按 gofmt 格式化（本地执行 make fmt-fix）："
            echo "$out"
            exit 1
          fi
          echo "gofmt OK"

      - name: go vet
        run: go vet ./...
        env:
          CGO_ENABLED: '0'

      - name: go test
        run: go test ./... -count=1
        env:
          CGO_ENABLED: '0'

      - name: 构建目标产物（CGO 关闭）
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          out="dist/agoramodel-$GOOS-$GOARCH"
          if [ "$GOOS" = "windows" ]; then out="$out.exe"; fi
          # 不注入版本号：使用 cmd/agoramodel 内置的语义化版本号（控制台左上角显示它）
          go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/agoramodel
          # 跨 step 共享：后续「校验 CGO 已关闭」与「冒烟」step 需要 $OUT / $GOOS / $GOARCH。
          # 用 GitHub 官方支持的「echo >> $GITHUB_ENV」形式持久化（不会自动 export 到当前 shell，但会被注入到后续 step）。
          echo "OUT=$out" >> "$GITHUB_ENV"
          echo "GOOS=$GOOS" >> "$GITHUB_ENV"
          echo "GOARCH=$GOARCH" >> "$GITHUB_ENV"

      - name: 校验 CGO 已关闭
        shell: bash
        run: |
          set -euo pipefail
          go version -m "$OUT" | grep -q 'CGO_ENABLED=0' && echo "CGO_ENABLED=0 OK"

      # 冒烟只在本机架构上执行（交叉架构产物无法直接运行）。
      #
      # 用 --exe 复用上面刚构建的**发布产物**：验证的是将要交付的那份二进制，
      # 而不是另起一次 go build 的开发二进制。冒烟脚本是 Node，三平台共用同一份实现
      # （tools/smoke/*.mjs），因此不再需要为每个 runner 维护内联的 bash 断言。
      #
      # 覆盖范围：
      #   phase1  协议透传、SSE 心跳保活、上游超时/不可达、错误码、请求体上限、断连取消
      #   phase2  SQLite 持久化、凭证加密落库、网关 Key 生命周期、SSRF、主密钥丢失
      #   phase3  模型聚合（/v1/models）、按需拉取与勾选、供应商名命名空间路由、模型别名
      #   phase4  Web UI 静态资源与 SPA 回退、控制面 API 全流程、登录模式（ADMIN_PASSWORD）
      - name: 冒烟（本机架构，复用发布产物）
        shell: bash
        run: |
          set -euo pipefail
          host_arch="$(go env GOHOSTARCH)"
          host_os="$(go env GOHOSTOS)"
          if [ "$host_os" != "$GOOS" ] || [ "$host_arch" != "$GOARCH" ]; then
            echo "跳过冒烟：目标 $GOOS/$GOARCH != 本机 $host_os/$host_arch"
            exit 0
          fi
          chmod +x "$OUT" 2>/dev/null || true
          node tools/smoke/phase1.mjs --exe="$OUT"
          node tools/smoke/phase2.mjs --exe="$OUT"
          node tools/smoke/phase3.mjs --exe="$OUT"
          node tools/smoke/phase4.mjs --exe="$OUT"

  # race detector 需要 cgo，因此单独一个 job（发布产物一律 CGO_ENABLED=0）
  race:
    name: race detector (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -race
        env:
          CGO_ENABLED: '1'
        run: go test ./... -count=1 -race
