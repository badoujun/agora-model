name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # 三平台 × 两架构的构建与冒烟矩阵（T0.6）
  build-test:
    name: ${{ matrix.runner }} / ${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, goos: windows, goarch: amd64 }
          - { runner: windows-latest, goos: windows, goarch: arm64 }
          - { runner: ubuntu-latest,  goos: linux,   goarch: amd64 }
          - { runner: ubuntu-latest,  goos: linux,   goarch: arm64 }
          - { runner: macos-latest,   goos: darwin,  goarch: amd64 }
          - { runner: macos-latest,   goos: darwin,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # 由 go.mod 决定（当前 1.25+，受 modernc.org/sqlite 最低版本要求约束）
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...
        env:
          CGO_ENABLED: '0'

      - name: go test
        run: go test ./... -count=1
        env:
          CGO_ENABLED: '0'

      - name: 构建目标产物（CGO 关闭）
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          out="dist/agoramodel-$GOOS-$GOARCH"
          if [ "$GOOS" = "windows" ]; then out="$out.exe"; fi
          # 不注入版本号：使用 cmd/agoramodel 内置的语义化版本号（控制台左上角显示它）
          go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/agoramodel
          # 跨 step 共享：后续「校验 CGO 已关闭」与「冒烟」step 需要 $OUT / $GOOS / $GOARCH。
          # 用 GitHub 官方支持的「echo >> $GITHUB_ENV」形式持久化（不会自动 export 到当前 shell，但会被注入到后续 step）。
          echo "OUT=$out" >> "$GITHUB_ENV"
          echo "GOOS=$GOOS" >> "$GITHUB_ENV"
          echo "GOARCH=$GOARCH" >> "$GITHUB_ENV"

      - name: 校验 CGO 已关闭
        shell: bash
        run: |
          set -euo pipefail
          go version -m "$OUT" | grep -q 'CGO_ENABLED=0' && echo "CGO_ENABLED=0 OK"

      # 冒烟只在本机架构上执行（交叉架构产物无法直接运行）。
      # 覆盖：healthz、无凭证 401、OpenAI 透传、凭证加密（Phase 2：网关 Key 来自数据库）。
      - name: 冒烟（本机架构）
        shell: bash
        run: |
          set -euo pipefail
          host_arch="$(go env GOHOSTARCH)"
          host_os="$(go env GOHOSTOS)"
          if [ "$host_os" != "$GOOS" ] || [ "$host_arch" != "$GOARCH" ]; then
            echo "跳过冒烟：目标 $GOOS/$GOARCH != 本机 $host_os/$host_arch"
            exit 0
          fi
          chmod +x "$OUT" 2>/dev/null || true

          # mock 上游日志用 GitHub Actions 提供的 $RUNNER_TEMP（跨平台：windows 上
          # 是 C:\Users\<user>\AppData\Local\Temp；unix 上是 /tmp）。避免直接用 /tmp，
          # Windows runner 默认 bash 里 /tmp 不一定可写，会让 mock 进程 stdout 重定向失败
          # 而静默退出（不监听 9999），后续透传报 connection refused。
          TMP_DIR="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          mock_log="$TMP_DIR/mock.log"
          gw_log="$TMP_DIR/gw.log"
          PORT=9999 node --no-deprecation tools/mock-upstream/server.mjs > "$mock_log" 2>&1 &
          mock_pid=$!

          # 等 mock 上游真的开始监听 9999（最多 10 秒）。这样如果 mock 进程因为
          # 端口冲突、node 路径问题、stdout 重定向失败等原因没起来，能立刻报错。
          for i in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:9999/v1/models > /dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:9999/v1/models > /dev/null 2>&1; then
            echo "mock upstream 未在 9999 端口监听"
            echo "--- mock.log ---"
            cat "$mock_log" || true
            exit 1
          fi
          echo "mock upstream ready"

          data_dir="$(mktemp -d)"
          # Phase 2 起 config.example.json 里的 api_key 不参与认证：网关 Key 由数据库生成，
          # 首次启动会打印明文一次，从日志中取回。
          "$OUT" --config config.example.json --data-dir "$data_dir" \
            --listen 127.0.0.1 --port 19090 > "$gw_log" 2>&1 &
          gw_pid=$!
          trap 'kill $gw_pid $mock_pid 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            grep -q 'gateway_key=' "$gw_log" 2>/dev/null && break || sleep 1
          done
          gw_key=$(grep -o 'gateway_key=gw-[0-9a-f]*' "$gw_log" | head -1 | cut -d= -f2 || true)
          if [ -z "$gw_key" ]; then echo "未能从启动日志取得网关 Key"; cat "$gw_log"; exit 1; fi
          echo "gateway key 已取得"

          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:19090/healthz > /dev/null 2>&1 && break || sleep 1
          done
          curl -fsS http://127.0.0.1:19090/healthz | grep -q '"status":"ok"'
          echo "healthz OK"

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:19090/v1/chat/completions \
            -H 'content-type: application/json' -d '{"model":"mock-gpt-4o"}')
          [ "$code" = "401" ] || { echo "期望无凭证 401，实际 $code"; exit 1; }
          echo "鉴权 OK"

          out=$(curl -s -X POST http://127.0.0.1:19090/v1/chat/completions \
            -H 'content-type: application/json' -H "authorization: Bearer $gw_key" \
            -d '{"model":"mock-gpt-4o","messages":[{"role":"user","content":"hi"}]}')
          echo "$out" | grep -q 'mock' || { echo "OpenAI 透传失败: $out"; exit 1; }
          echo "OpenAI 透传 OK"

          acode=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:19090/v1/messages \
            -H 'content-type: application/json' -H "x-api-key: $gw_key" \
            -d '{"model":"mock-claude-sonnet-4-5","max_tokens":16,"messages":[{"role":"user","content":"hi"}]}')
          [ "$acode" = "404" ] || { echo "Anthropic 路径应已下线（404），实际 $acode"; exit 1; }
          echo "Anthropic 路径已下线 OK"

          sleep 1
          if grep -a -q 'sk-mock-provider-key' "$data_dir/agora.db" "$data_dir/agora.db-wal" 2>/dev/null; then
            echo "数据库中出现供应商凭证明文"; exit 1
          fi
          echo "凭证加密 OK"

          # Phase 3：模型选择与 /v1/models（config.example.json 已勾选 mock 上游的 3 个模型）
          mout=$(curl -s http://127.0.0.1:19090/v1/models -H "authorization: Bearer $gw_key")
          echo "$mout" | grep -q '"object":"list"' || { echo "/v1/models 返回异常: $mout"; exit 1; }
          echo "$mout" | grep -q '"id":"mock-gpt-4o"' || { echo "已勾选模型未出现在 /v1/models: $mout"; exit 1; }
          echo "$mout" | grep -q '"owned_by":"本地 Mock 上游"' || { echo "owned_by 应为供应商名称: $mout"; exit 1; }
          echo "模型选择 OK"

  # race detector 需要 cgo，因此单独一个 job（发布产物一律 CGO_ENABLED=0）
  race:
    name: race detector (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -race
        env:
          CGO_ENABLED: '1'
        run: go test ./... -count=1 -race
